name: LARA Release to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NEWNIGHTLY: "yes"
      NIGHTLYBUILD: "yes"
      MAVEN_REPOSITORY_URL: https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
      MAVEN_REPOSITORY_REALM: Sonatype Nexus Repository Manager
      MAVEN_REPOSITORY_HOST: s01.oss.sonatype.org
      MAVEN_REPOSITORY_USER: ${{ secrets.SONATYPE_USERNAME }}
      MAVEN_REPOSITORY_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.SONATYPE_PGP_KEY }}
          passphrase: ${{ secrets.SONATYPE_PGP_PASSPHRASE }}
      - name: Get version string
        run: |
          ver=$(./project/scripts/sbt "print scala3-compiler-bootstrapped/version" | tail -n1)
          echo "Publishing version: $ver"
      - name: Publish to Maven Central
        run: sbt scala3-bootstrapped/publishSigned
