name: LARA Release to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NEWNIGHTLY: "yes"
      NIGHTLYBUILD: "yes"
      MAVEN_REPOSITORY_REALM: GitHub Pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
      - uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 17
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Get version string
        run: |
          ver=$(./project/scripts/sbt "print scala3-compiler-bootstrapped/version" | tail -n1)
          echo "Publishing version: $ver"
      - name: Publish artifacts to local Maven repository
        run: sbt scala3-bootstrapped/publish
        env:
          MAVEN_REPOSITORY_URL: "file://${{ github.workspace }}/gh-pages/maven"
      - name: Deploy to GitHub Pages
        working-directory: gh-pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add maven/
          git commit -m "Publish $ver"
          git push
